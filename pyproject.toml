[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diamond-dae-pipeline"
version = "1.1.1"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "ipykernel>=7.1.0",
    "scipy>=1.16.3",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "torch>=2.9.1",
    "h5py>=3.15.1",
    "optuna>=4.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
